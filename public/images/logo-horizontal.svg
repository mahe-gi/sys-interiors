<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" width="340" height="84" fill="none">
  <!-- Left: Architectural Skyline Icon -->
  <g transform="translate(6, 6) scale(0.52)">
    <!-- Base Reference Line -->
    <path d="M 18 126 L 198 126" stroke="#DE2626" stroke-width="3" stroke-linecap="round" opacity="0.15"/>

    <!-- Left Building Wireframe -->
    <path d="M 44 126 L 44 88 L 68 64 L 92 78 L 92 126" 
          stroke="#DE2626" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="68" y1="64" x2="68" y2="126" stroke="#DE2626" stroke-width="3" stroke-linecap="round"/>
    <path d="M 22 126 L 22 108 L 44 88" 
          stroke="#DE2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Building Wireframe & Architectural Ribbon -->
    <path d="M 124 126 L 124 74 L 148 60 L 172 82 L 172 126" 
          stroke="#DE2626" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="148" y1="60" x2="148" y2="126" stroke="#DE2626" stroke-width="3" stroke-linecap="round"/>
    <path d="M 172 82 L 194 102 L 194 126" 
          stroke="#DE2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 132 118 Q 164 100 188 116" 
          stroke="#DE2626" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Central Featured Tower -->
    <path d="M 92 126 L 92 36 L 108 12 L 108 126 Z" fill="#DE2626"/>
    <path d="M 108 12 L 124 28 L 124 126 L 108 126 Z" fill="#BE1E1E"/>
    <line x1="108" y1="12" x2="108" y2="126" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right: Typography Lockup -->
  <!-- "SYS" Bold Navy Lettermark -->
  <text x="124" y="48" 
        font-family="system-ui, -apple-system, 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="-0.5" 
        fill="#1C386A">
    SYS
  </text>

  <!-- "INTERIORS" Crisp Red Wordmark -->
  <text x="126" y="70" 
        font-family="system-ui, -apple-system, 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="3.8" 
        fill="#DE2626">
    INTERIORS
  </text>
</svg>
