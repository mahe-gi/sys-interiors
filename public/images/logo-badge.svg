<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" width="540" height="370" fill="none">
  <!-- Top: Architectural Red Skyline Icon -->
  <g id="architectural-icon" transform="translate(110, 0)">
    <!-- Left Wing Baseline Extension -->
    <path d="M 52 118 L 84 118" stroke="#DE2420" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Left Building Outline -->
    <path d="M 84 118 L 84 76 L 132 54" stroke="#DE2420" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="84" y1="118" x2="84" y2="76" stroke="#DE2420" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Central Skyscraper (Slanted 3D Roofline & Solid Pillar) -->
    <path d="M 132 118 L 132 54 L 152 44 L 152 118 Z" fill="#DE2420"/>
    <path d="M 132 54 L 170 34 L 170 118" stroke="#DE2420" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="170" y1="34" x2="170" y2="118" stroke="#DE2420" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Right Building Outline & Diagonal Structural Ribbon -->
    <path d="M 170 54 L 208 68 L 208 118" stroke="#DE2420" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 170 88 L 228 108 L 228 118" stroke="#DE2420" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Middle: Authentic "SYS" Lettermark -->
  <g id="sys-lettermark" transform="translate(110, 10)">
    <!-- Left 'S' -->
    <path d="M 102 165 C 102 153 92 144 76 144 C 60 144 48 152 48 167 C 48 181 58 189 74 195 C 95 203 108 212 108 230 C 108 248 93 259 72 259 C 50 259 36 247 36 230 L 58 226 C 60 236 68 241 74 241 C 82 241 87 236 87 229 C 87 218 77 212 61 205 C 44 198 28 188 28 167 C 28 147 45 128 76 128 C 104 128 122 145 122 165 Z"
          fill="#113570"/>

    <!-- Right 'S' -->
    <path d="M 284 165 C 284 153 274 144 258 144 C 242 144 230 152 230 167 C 230 181 240 189 256 195 C 277 203 290 212 290 230 C 290 248 275 259 254 259 C 232 259 218 247 218 230 L 240 226 C 242 236 250 241 256 241 C 264 241 269 236 269 229 C 269 218 259 212 243 205 C 226 198 210 188 210 167 C 210 147 227 128 258 128 C 286 128 304 145 304 165 Z"
          fill="#113570"/>

    <!-- Central 'Y' with Knockout & Hollow Core -->
    <path d="M 120 133 L 146 133 L 152 154 L 152 248 L 144 258 L 186 258 L 178 248 L 178 154 L 184 133 L 210 133 L 188 184 L 188 252 L 142 252 L 142 184 Z"
          stroke="#F6F3EE" stroke-width="9" stroke-linejoin="round" fill="none"/>
    <path d="M 122 133 L 148 133 L 165 174 L 182 133 L 208 133 L 180 190 L 180 252 L 150 252 L 150 190 Z"
          fill="#113570"/>
    <rect x="159" y="196" width="12" height="46" rx="2" fill="#F6F3EE"/>
    <polygon points="152,133 178,133 165,164" fill="#F6F3EE"/>
    <rect x="150" y="244" width="30" height="8" rx="1" fill="#113570"/>
  </g>

  <!-- Wordmark "INTERIORS" -->
  <g id="interiors-wordmark" transform="translate(270, 302)">
    <text text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Montserrat', 'Arial Black', sans-serif" 
          font-size="33" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#DE2420">
      INTERIORS
    </text>
  </g>

  <!-- Bottom: Official Red Pill Badge "DESIGNING SPACES • DEFINING LIFESTYLES" -->
  <g id="tagline-badge" transform="translate(270, 340)">
    <!-- Rounded Pill Background -->
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#DE2420"/>
    <!-- Left Tagline Phrase -->
    <text text-anchor="end" x="-14" y="5" 
          font-family="system-ui, -apple-system, 'Montserrat', 'Arial Black', sans-serif" 
          font-size="14.5" 
          font-weight="800" 
          letter-spacing="1.5" 
          fill="#FFFFFF">
      DESIGNING SPACES
    </text>
    <!-- Blue Center Separator Dot -->
    <circle cx="0" cy="0" r="4.5" fill="#113570"/>
    <!-- Right Tagline Phrase -->
    <text text-anchor="start" x="14" y="5" 
          font-family="system-ui, -apple-system, 'Montserrat', 'Arial Black', sans-serif" 
          font-size="14.5" 
          font-weight="800" 
          letter-spacing="1.5" 
          fill="#FFFFFF">
      DEFINING LIFESTYLES
    </text>
  </g>
</svg>
