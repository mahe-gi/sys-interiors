<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Minimal architectural SYS mark -->
  <g transform="translate(6, 10)">
    <!-- Architectural geometric framing line -->
    <rect x="0" y="2" width="36" height="36" rx="3" stroke="#181818" stroke-width="2.5" fill="none"/>
    <!-- Subtle SYS brand red & blue interior geometric accents -->
    <line x1="8" y1="12" x2="28" y2="12" stroke="#D92525" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="20" x2="22" y2="20" stroke="#181818" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="28" x2="28" y2="28" stroke="#143D6B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="56" y="32" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="#181818">SYS</text>
  <text x="118" y="32" font-family="'Manrope', -apple-system, sans-serif" font-size="20" font-weight="300" letter-spacing="3" fill="#66615A">INTERIORS</text>
  <text x="57" y="44" font-family="'Manrope', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2" fill="#8C827A">DESIGNING SPACES • DEFINING LIFESTYLES</text>
</svg>
